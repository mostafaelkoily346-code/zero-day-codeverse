    javascript:['Create a function greet(name) that returns a welcome message for the supplied name.','Write isEven(number) and return true only for even numbers.','Build lastItem(items) without changing the original array.','Create countVowels(text) that counts a, e, i, o, and u.','Write findMax(numbers) without using Math.max.','Fix a loop that should sum numbers from 1 through n.','Create a User object with a greet method and a name property.','Parse a JSON string and return null when the input is invalid.','Build a filterEvens(numbers) mini utility that returns a new array.','Create fizzBuzzHack(n) for 1 through n using Fizz, Buzz, and FizzBuzz.'],

n><a href="https://t.me/D_I_S_H_A_1_5" target="_blank">@D_I_S_H_A_1_5 ↗</a></div></div><div class="terminal" style="margin-top:14px"><div class="terminal-head">zero-day / system.boot</div><div class="terminal-body"><div><span class="prompt">root@academy:~$</span> connect --future</div><div>Loading language tracks ........ <span class="green">OK</span></div><div>Generating missions ........... <span class="green">50 × 10</span></div><div>Creator identity .............. <span class="cyan">READY</span></div><br><div><span class="prompt">root@academy:~$</span> begin<span class="cursor"></span></div></div></div></section></main>`);}
  function login(){layout(`<main class="login-wrap"><button class="back" onclick="go('home')">← Back to home</button><div class="panel"><div class="auth-switch"><button class="active">Log in</button><button onclick="go('register')">Create account</button></div><div class="eyebrow">identity.check</div><h1>Welcome back.</h1><p class="muted">Continue your missions and keep your progress close.</p><form onsubmit="enter(event)"><div class="field"><label>ACCESS EMAIL</label><input id="email" type="email" required placeholder="you@example.com"></div><div class="field"><label>PASSWORD</label><input type="password" required minlength="6" placeholder="Your password"></div><button class="btn btn-primary" style="width:100%;margin-top:8px">Enter academy →</button></form><div class="demo-note">Demo mode: your account and progress are stored locally in this browser.</div></div></main>`);}
  function registerView(){layout(`<main class="login-wrap"><button class="back" onclick="go('home')">← Back to home</button><div class="panel"><div class="auth-switch"><button onclick="go('login')">Log in</button><button class="active">Create account</button></div><div class="eyebrow">identity.create</div><h1>Build your identity.</h1><p class="muted">Create an account to enter the Zero Day academy.</p><form onsubmit="createAccount(event)"><div class="field"><label>CODER NAME</label><input id="newUser" required minlength="2" placeholder="Your name"></div><div class="field"><label>EMAIL</label><input id="newEmail" type="email" required placeholder="you@example.com"></div><div class="field"><label>PASSWORD</label><input id="newPassword" type="password" required minlength="6" placeholder="At least 6 characters"></div><div class="field"><label>CONFIRM PASSWORD</label><input id="confirmPassword" type="password" required minlength="6" placeholder="Repeat your password"></div><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" required style="width:auto"> I agree to the academy terms.</label><button class="btn btn-primary" style="width:100%;margin-top:18px">Create my account →</button></form><div class="demo-note">No real backend is connected yet. This demo keeps your display name in local storage only.</div></div></main>`);}
  function developerView(){layout(`<main class="view"><button class="back" onclick="go('home')">← Back to home</button><section class="profile-hero"><div class="profile-avatar">&gt;_</div><div><div class="eyebrow">zero-day / architect.profile</div><h1 class="creator-name" aria-label="MOSTAFA ELKHOILY"><span class="name-letter">M</span><span class="name-letter">O</span><span class="name-letter">S</span><span class="name-letter">T</span><span class="name-letter">A</span><span class="name-letter">F</span><span class="name-letter">A</span><span class="name-letter"> </span><span class="name-letter">E</span><span class="name-letter">L</span><span class="name-letter">K</span><span class="name-letter">H</span><span class="name-letter">O</span><span class="name-letter">I</span><span class="name-letter">L</span><span class="name-letter">Y</span></h1><p class="muted">Creator, full-stack developer, and game systems designer.</p><div class="hero-actions"><button class="btn btn-primary" onclick="go('languages')">Explore the academy →</button><span class="stat green">BUILD v0.1.0 ALPHA</span></div></div></section><div class="profile-grid"><section class="profile-card"><div class="eyebrow">01 / mission</div><h2>Learning should feel alive.</h2><p class="muted">Zero Day turns programming fundamentals into missions, progression, and worlds worth exploring. The goal is simple: make the moment code clicks feel like a real achievement.</p></section><section class="profile-card"><div class="eyebrow">02 / stack</div><h3>Built with</h3><div class="contact"><span>Frontend</span><b class="cyan">React · Three.js</b></div><div class="contact"><span>Backend</span><b class="cyan">Node.js · PostgreSQL</b></div><div class="contact"><span>Direction</span><b class="cyan">Game systems · UI/UX</b></div></section><section class="profile-card"><div class="eyebrow">03 / contact</div><h3>Find the creator</h3><div class="contact"><span>Instagram</span><a href="https://www.instagram.com/eng_disha_xx_1" target="_blank">@eng_disha_xx_1 ↗</a></div><div class="contact"><span>Zero Day Instagram</span><a href="https://www.instagram.com/zeroday.root?igsi=MWVtMWZrMXUwN3lwYw==" target="_blank">@zeroday.root ↗</a></div><div class="contact"><span>WhatsApp</span><a href="https://wa.me/201126585139" target="_blank">01126585139 ↗</a></div><div class="contact"><span>Telegram</span><a href="https://t.me/D_I_S_H_A_1_5" target="_blank">@D_I_S_H_A_1_5 ↗</a></div></section><section class="profile-card"><div class="eyebrow">04 / roadmap</div><h3>The next unlocks</h3><p class="muted">Ten language worlds, 500 staged missions, a 3D academy hub, and character progression.</p><div class="bar"><span style="width:20%;background:var(--violet)"></span></div><p class="small muted" style="margin-top:10px">Core learning loop online · world expanding</p></section></div></main>`);}
  function enter(e){e.preventDefault();state.user=document.getElementById('user').value.trim();localStorage.setItem('zero-day-user',state.user);go('languages');}
  function createAccount(e){e.preventDefault();const password=document.getElementById('newPassword').value;const confirmation=document.getElementById('confirmPassword').value;if(password!==confirmation){alert('Passwords do not match.');return;}state.user=document.getElementById('newUser').value.trim();localStorage.setItem('zero-day-user',state.user);localStorage.setItem('zero-day-email',document.getElementById('newEmail').value);go('languages');}
  function logout(){state.user='';localStorage.removeItem('zero-day-user');go('home');}
  function languagesView(){layout(`<main class="view"><div class="page-head"><div><div class="eyebrow">academy.tracks / ${languages.length} worlds</div><h1>Choose your language</h1><p class="muted">Each language has 50 missions that grow from foundations to a final boss challenge.</p></div><button class="btn btn-ghost" onclick="go('home')">← Home</button></div><div class="language-grid">${languages.map((l,i)=>`<button class="lang-card" style="--accent:${l.color}" onclick="selectLanguage('${l.id}')"><div class="lang-icon">${l.icon}</div><strong>${l.name}</strong><div class="small">50 staged missions</div><div class="bar"><span style="width:${(progress(l)/50)*100}%"></span></div><div class="small" style="margin-top:7px;color:var(--accent)">${progress(l)} / 50 cleared</div></button>`).join('')}</div></main>`);}
  function progress(l){return Object.keys(state.done).filter(k=>k.startsWith(l.id+'-')&&state.done[k]).length;}
  function selectLanguage(id){state.selectedLanguage=id;state.level=1;go('track');}
  function isUnlocked(l,n){return n===1||!!state.done[l.id+'-'+(n-1)];}
  function track(){const l=languages.find(x=>x.id===state.selectedLanguage)||languages[0]; let levels=Array.from({length:50},(_,i)=>i+1); if(!isUnlocked(l,state.level)) state.level=1; layout(`<main class="view"><button class="back" onclick="go('languages')">← All language tracks</button><div class="page-head"><div><div class="eyebrow">${l.icon} / ${l.name}.track</div><h1>${l.name} missions</h1><p class="muted">Finish each mission to unlock the next one. Locked levels cannot be opened early.</p></div><div class="stat ${l.id==='javascript'?'green':''}">${progress(l)} / 50 complete</div></div><div class="track-layout"><aside class="panel mission-list">${levels.map(n=>{let key=l.id+'-'+n,complete=!!state.done[key],unlocked=isUnlocked(l,n);return `<button class="mission ${complete?'complete':''} ${!unlocked?'locked':''} ${n===state.level?'selected':''}" ${unlocked?'':'disabled'} onclick="openLevel(${n})"><span class="mission-no">${complete?'✓':unlocked?String(n).padStart(2,'0'):'🔒'}</span><span class="mission-name"><b>Level ${n}</b><br><span class="small muted">${topics[(n-1)%topics.length]}</span></span></button>`}).join('')}</aside><section class="panel challenge">${challenge(l,state.level)}</section></div></main>`);}
  function levelLesson(l,n){const stage=Math.ceil(n/5);const stageNames=['Foundations','Control flow','Data structures','Reusable logic','Algorithms','Debugging','Object design','Data & APIs','Mini projects','Boss challenge'];return {stage,name:stageNames[stage-1]};}
  function challenge(l,n){let key=l.id+'-'+n,complete=!!state.done[key],lesson=levelLesson(l,n),questions=challengeSets[l.id]||challengeSets.javascript,question=questions[(n-1)%questions.length],hintText=hintSets[(n-1)%hintSets.length];let brief=`${l.name} · Level ${n} · ${lesson.name}\n\nTask:\n${question}\n\nWrite your own solution below. Nothing is pre-filled.`;return `<div class="eyebrow">MISSION ${String(n).padStart(2,'0')} · ${lesson.name}</div><h2>${l.name} / Level ${n}</h2><p class="muted">${question}</p><pre>${escapeHtml(brief)}</pre><textarea id="answer" spellcheck="false" placeholder="Write your ${l.name} solution here..."></textarea><div class="challenge-foot"><button class="btn btn-primary" onclick="submitLevel('${key}',${n},'${l.id}')">${complete?'✓ Mission cleared':'▶ Submit solution'}</button><button class="btn btn-ghost" onclick="hint(${n})">💡 Reveal hint</button><span class="small muted">Reward: +${n*10} XP · +${n*2} coins</span></div><p id="feedback" class="small" style="margin-top:17px"></p>`;}
  function escapeHtml(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');}
  function openLevel(n){const l=languages.find(x=>x.id===state.selectedLanguage)||languages[0];if(!isUnlocked(l,n)){const f=document.getElementById('feedback');if(f) f.textContent='Finish the previous mission first.';return;}state.level=n;track();}
  function hint(n){const f=document.getElementById('feedback');if(f) {f.className='small gold';f.textContent=`Hint ${n}: ${hintSets[(n-1)%hintSets.length]}`;}}
  function submitLevel(key,n,id){const answer=document.getElementById('answer');if(!answer||answer.value.trim().length<8){const f=document.getElementById('feedback');if(f){f.className='small';f.style.color='var(--danger)';f.textContent='Write your solution in the editor before submitting.';}return;}state.done[key]=true;save();track();setTimeout(()=>{const f=document.getElementById('feedback');if(f){f.className='small green';f.textContent=`Level ${n} cleared. Level ${n<50?n+1:'50'} is now available.`}},0);}
  registerView();
